[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "query-plan-regression-auditor"
version = "1.0.0"
description = "Automated Query-Plan Regression Auditor & Partition-Pruning Optimization Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["plan_auditor*"]
